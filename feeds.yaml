# tier is what the source IS, not how good it is:
#   1 = practice      hands-on agent/harness engineering, applied LLMs
#   2 = primary       a lab or platform publishing its own work
#   3 = research      papers, alignment, and analysis of them
#
# Tags must be unique — seed state is tracked per tag, so two feeds sharing one
# would seed together and swallow each other's articles.
#
# Every url below was fetched and verified on 2026-08-28: HTTP 200, non-empty,
# and every entry carrying a parseable publication date. An entry whose date
# cannot be parsed is dropped, and a feed that yields entries but no parseable
# dates fails the run — see parse.MAX_AGE_DAYS and collect_articles.
